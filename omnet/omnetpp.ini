[General]
# sim-time-limit and the Poisson parameters below are rewritten by align_and_generate_multi_ue.py in every run.
sim-time-limit = 11862.6s  # longest trace + 5 s

# server (receiver)
*.server.numApps = 1
*.server.app[0].typename = "UdpSinkApp"
*.server.app[0].io.localPort = 1000

# ---------------------------------------------------------------
# five UEs, one access point, one server
# ---------------------------------------------------------------
[Config Multi_Wifi_Base]
network = MultiUeWifiScenario

# positions
*.ap.mobility.typename = "StationaryMobility"
*.ap.mobility.initialX = 400m   
*.ap.mobility.initialY = 300m
*.ap.mobility.initialZ = 0m
*.ue[*].mobility.initFromDisplayString = false

# the five UEs on a circle of 10 m radius around the access point
*.ue[*].mobility.typename = "StationaryMobility"
*.ue[*].mobility.initialZ = 0m

*.ue[0].mobility.initialX = 410.0m
*.ue[0].mobility.initialY = 300.0m

*.ue[1].mobility.initialX = 403.1m
*.ue[1].mobility.initialY = 309.5m

*.ue[2].mobility.initialX = 391.9m
*.ue[2].mobility.initialY = 305.9m

*.ue[3].mobility.initialX = 391.9m
*.ue[3].mobility.initialY = 294.1m

*.ue[4].mobility.initialX = 403.1m
*.ue[4].mobility.initialY = 290.5m

# capacity of all MAC queues: 1000 packets
**.wlan[*].mac.**.packetCapacity = 1000

# IEEE 802.11ac
*.ue[*].wlan[0].opMode = "ac"
*.ue[*].wlan[0].mac.ssid = "MlDigitalTwin"

*.ap.wlan[0].opMode = "ac"
*.ap.wlan[0].mac.ssid = "MlDigitalTwin"

# server (receiver)
*.server.numApps = 1
*.server.app[0].typename = "UdpSinkApp"
*.server.app[0].io.localPort = 1000

# recorded vectors
*.server.app[0].sink.meanBitLifeTimePerPacket.result-recording-modes = +vector
*.ue[*].wlan[0].mac.dcf.channelAccess.pendingQueue.queueLength.result-recording-modes = +vector
*.ue[*].wlan[0].mac.dcf.channelAccess.pendingQueue.queueBitLength.result-recording-modes = +vector
*.ue[*].wlan[0].mac.dcf.recoveryProcedure.contentionWindowChanged.result-recording-modes = +vector

# ---------------------------------------------------------------
# real traffic: replay of the real test flows
# ---------------------------------------------------------------
[Config Real_Traffic_Multi_Wifi]
extends = Multi_Wifi_Base
description = "5 UEs, real traffic"

*.ue[*].numApps = 1
*.ue[*].app[0].typename = "MlTraceUdpApp"
*.ue[*].app[0].destAddress = "server"
*.ue[*].app[0].destPort = 1000
*.ue[*].app[0].localPort = -1

# one trace per UE
*.ue[0].app[0].traceFile = "real_traces/real_trace_ue0.csv"
*.ue[1].app[0].traceFile = "real_traces/real_trace_ue1.csv"
*.ue[2].app[0].traceFile = "real_traces/real_trace_ue2.csv"
*.ue[3].app[0].traceFile = "real_traces/real_trace_ue3.csv"
*.ue[4].app[0].traceFile = "real_traces/real_trace_ue4.csv"

# ---------------------------------------------------------------
# synthetic traffic of the proposed generator
# ---------------------------------------------------------------
[Config ML_Traffic_Multi_Wifi]
extends = Multi_Wifi_Base
description = "5 UEs, synthetic traffic"

*.ue[*].numApps = 1
*.ue[*].app[0].typename = "MlTraceUdpApp"
*.ue[*].app[0].destAddress = "server"
*.ue[*].app[0].destPort = 1000
*.ue[*].app[0].localPort = -1

# one trace per UE
*.ue[0].app[0].traceFile = "ml_traces/ml_trace_ue0.csv"
*.ue[1].app[0].traceFile = "ml_traces/ml_trace_ue1.csv"
*.ue[2].app[0].traceFile = "ml_traces/ml_trace_ue2.csv"
*.ue[3].app[0].traceFile = "ml_traces/ml_trace_ue3.csv"
*.ue[4].app[0].traceFile = "ml_traces/ml_trace_ue4.csv"

# ---------------------------------------------------------------
# Poisson baseline: mean packet size and mean IAT of the real trace of each UE
# ---------------------------------------------------------------
[Config Basic_Traffic_Multi_Wifi]
extends = Multi_Wifi_Base
description = "5 UEs, Poisson traffic with the mean size and rate of the real traces"

*.ue[*].numApps = 1
*.ue[*].app[0].typename = "UdpBasicApp"
*.ue[*].app[0].destAddresses = "server"
*.ue[*].app[0].destPort = 1000
*.ue[*].app[0].localPort = -1
*.ue[*].app[0].startTime = 2s 

# UE 0
*.ue[0].app[0].messageLength = 964B
*.ue[0].app[0].sendInterval = exponential(0.01431s)
*.ue[0].app[0].stopTime = 11857.6s

# UE 1
*.ue[1].app[0].messageLength = 171B
*.ue[1].app[0].sendInterval = exponential(6.84046s)
*.ue[1].app[0].stopTime = 658.7s

# UE 2
*.ue[2].app[0].messageLength = 966B
*.ue[2].app[0].sendInterval = exponential(0.00077s)
*.ue[2].app[0].stopTime = 535.2s

# UE 3
*.ue[3].app[0].messageLength = 966B
*.ue[3].app[0].sendInterval = exponential(0.00202s)
*.ue[3].app[0].stopTime = 172.2s

# UE 4
*.ue[4].app[0].messageLength = 238B
*.ue[4].app[0].sendInterval = exponential(1.56775s)
*.ue[4].app[0].stopTime = 157.2s